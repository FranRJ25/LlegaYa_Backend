x-django-common: &django-common
  REGISTRO_SERVICIOS_URL: http://registro-servicios:8500
  CONFIG_SERVER_URL: http://config-server:8600
  API_GATEWAY_URL: http://api-gateway:8080
  DJANGO_PERFIL: docker
  DEBUG: "true"
  SECRET_KEY: ${SECRET_KEY:-llegaya-clave-dev-cambiar-en-produccion}
  CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8080

services:
  redis:
    image: redis:7-alpine
    networks: [llegaya-network]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    networks: [llegaya-network]
    environment:
      POSTGRES_USER: llegaya
      POSTGRES_PASSWORD: llegaya
      POSTGRES_DB: llegaya
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llegaya"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    networks: [llegaya-network]
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    networks: [llegaya-network]
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LlegaYa_2024!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  registro-servicios:
    build: ./registro-servicios
    networks: [llegaya-network]
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8500:8500"
    depends_on:
      redis:
        condition: service_healthy

  config-server:
    build: ./config-server
    networks: [llegaya-network]
    ports:
      - "8600:8600"

  api-gateway:
    build: ./api-gateway
    networks: [llegaya-network]
    environment:
      REGISTRO_SERVICIOS_URL: http://registro-servicios:8500
    ports:
      - "8080:8080"
    depends_on:
      - registro-servicios
      - config-server

  servicio-usuarios:
    build: ./servicio-usuarios
    networks: [llegaya-network]
    environment:
      <<: *django-common
      NOMBRE_SERVICIO: servicio-usuarios
      SERVICIO_HOST: servicio-usuarios
      SERVICIO_PUERTO: "8001"
      DATABASE_URL: postgres://llegaya:llegaya@postgres:5432/usuarios_db
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    volumes:
      - usuarios_media:/app/media
    ports:
      - "8001:8001"
    depends_on:
      - registro-servicios
      - config-server
      - postgres

  servicio-negocios:
    build: ./servicio-negocios
    networks: [llegaya-network]
    environment:
      <<: *django-common
      NOMBRE_SERVICIO: servicio-negocios
      SERVICIO_HOST: servicio-negocios
      SERVICIO_PUERTO: "8002"
      DATABASE_URL: postgres://llegaya:llegaya@postgres:5432/negocios_db
    ports:
      - "8002:8002"
    depends_on:
      - registro-servicios
      - config-server
      - postgres

  servicio-productos:
    build: ./servicio-productos
    networks: [llegaya-network]
    environment:
      <<: *django-common
      NOMBRE_SERVICIO: servicio-productos
      SERVICIO_HOST: servicio-productos
      SERVICIO_PUERTO: "8003"
      DATABASE_URL: postgres://llegaya:llegaya@postgres:5432/productos_db
    ports:
      - "8003:8003"
    depends_on:
      - registro-servicios
      - config-server
      - postgres

  servicio-pedidos:
    build: ./servicio-pedidos
    networks: [llegaya-network]
    environment:
      <<: *django-common
      NOMBRE_SERVICIO: servicio-pedidos
      SERVICIO_HOST: servicio-pedidos
      SERVICIO_PUERTO: "8004"
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_NAME: pedidos_db
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-LlegaYa_2024!}
    ports:
      - "8004:8004"
    depends_on:
      registro-servicios:
        condition: service_started
      config-server:
        condition: service_started
      sqlserver:
        condition: service_healthy

  servicio-repartidores:
    build: ./servicio-repartidores
    networks: [llegaya-network]
    environment:
      <<: *django-common
      NOMBRE_SERVICIO: servicio-repartidores
      SERVICIO_HOST: servicio-repartidores
      SERVICIO_PUERTO: "8005"
      MONGO_URI: mongodb://mongo:27017/repartidores_db
    ports:
      - "8005:8005"
    depends_on:
      - registro-servicios
      - config-server
      - mongo

networks:
  llegaya-network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  mongo_data:
  sqlserver_data:
  usuarios_media:

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: servicio-negocios-data
  namespace: llegaya
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicio-negocios
  namespace: llegaya
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servicio-negocios
  template:
    metadata:
      labels:
        app: servicio-negocios
    spec:
      containers:
        - name: servicio-negocios
          image: llegaya/servicio-negocios:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: servicio-negocios-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: llegaya-secrets
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: servicio-negocios-db-secret
                  key: DATABASE_URL
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /salud/
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /salud/
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: servicio-negocios-data

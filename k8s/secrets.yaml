# PLACEHOLDERS: reemplazar estos valores antes de aplicar en un cluster real.
# Compartido por los 5 microservicios Django (necesario para validar JWT sin BD local
# en negocios/productos/pedidos/repartidores, ya que todos firman/verifican con la misma clave).
apiVersion: v1
kind: Secret
metadata:
  name: llegaya-secrets
  namespace: llegaya
type: Opaque
stringData:
  SECRET_KEY: "Contraseña-LlegaYa!"
  EMAIL_HOST_USER: "CAMBIAR-correo-remitente@gmail.com"
  EMAIL_HOST_PASSWORD: "CAMBIAR-password-de-aplicacion"
---
# Postgres LOCAL (pod propio, ver k8s/postgres/) compartido por usuarios/negocios/productos,
# igual que el contenedor "postgres" de docker-compose.
apiVersion: v1
kind: Secret
metadata:
  name: servicio-usuarios-db-secret
  namespace: llegaya
type: Opaque
stringData:
  DATABASE_URL: "postgres://llegaya:llegaya@postgres:5432/usuarios_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: servicio-negocios-db-secret
  namespace: llegaya
type: Opaque
stringData:
  DATABASE_URL: "postgres://llegaya:llegaya@postgres:5432/negocios_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: servicio-productos-db-secret
  namespace: llegaya
type: Opaque
stringData:
  DATABASE_URL: "postgres://llegaya:llegaya@postgres:5432/productos_db"
---
# SQL Server en-cluster (pod propio, ver k8s/sqlserver/) usado por servicio-pedidos.
apiVersion: v1
kind: Secret
metadata:
  name: sqlserver-secret
  namespace: llegaya
type: Opaque
stringData:
  SA_PASSWORD: "CAMBIAR-Password123!"
---
# MongoDB LOCAL (pod propio, ver k8s/mongo/) usado por servicio-repartidores,
# igual que el contenedor "mongo" de docker-compose.
apiVersion: v1
kind: Secret
metadata:
  name: servicio-repartidores-db-secret
  namespace: llegaya
type: Opaque
stringData:
  MONGO_URI: "mongodb://mongo:27017/repartidores_db"
